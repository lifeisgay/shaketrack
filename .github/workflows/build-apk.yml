name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write # to publish the release the app updates from
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      # Same signing key on every build, so Google sign-in keeps working (see README).
      # The key is committed encrypted (app/shaketrack.keystore.enc); the passphrase is a repo secret.
      - name: Restore signing key
        env:
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          if [ -z "$KEYSTORE_PASSPHRASE" ]; then
            echo "::error::KEYSTORE_PASSPHRASE secret is not set (see README, 'Signing key')"
            exit 1
          fi
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in app/shaketrack.keystore.enc \
                 -out app/shaketrack.keystore -pass env:KEYSTORE_PASSPHRASE; then
            echo "::error::Could not decrypt the signing key - KEYSTORE_PASSPHRASE doesn't match the one used to encrypt it"
            exit 1
          fi
          SHA1=$(keytool -list -v -keystore app/shaketrack.keystore -storepass android -alias shaketrack | grep -oE "SHA1: [0-9A-F:]+" | cut -d' ' -f2)
          echo "Signing key SHA-1: $SHA1"
          if [ "$SHA1" != "A3:AF:D4:E9:9D:E2:72:39:31:EB:10:27:28:99:31:49:8E:99:9C:71" ]; then
            echo "::error::Decrypted key isn't the one registered in Google Cloud"
            exit 1
          fi
      # The run number is the app's version code, so every build is newer than the last
      - run: gradle assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk ShakeTrack.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeTrack-apk
          path: ShakeTrack.apk
      # The app checks the latest release on start-up and offers to install it
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --pretty=%s)
          gh release create "build-${{ github.run_number }}" ShakeTrack.apk \
            --title "ShakeTrack build ${{ github.run_number }}" \
            --notes "$MSG" --latest
